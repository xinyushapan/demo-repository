{% load static %}
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心语沙盘 · 让心情有个小世界</title><link rel="stylesheet" href="{% static 'core/style.css' %}?v=13"><link rel="stylesheet" href="{% static 'core/cover.css' %}?v=13"></head>
<body class="home-page">
<main class="cover">
  <div class="cover-scene">
    <img class="cover-art" src="{% static 'core/images/cover-wide.png' %}" alt="" aria-hidden="true">
    <h1 class="cover-wordmark"><img src="{% static 'core/images/wordmark.svg' %}" alt="心语沙盘"></h1>
    <p class="cover-intro">不用急着解释。用物件搭出此刻的感受，<br>AI 会陪你一起看见它。</p>
    <div class="cover-actions">
      <a class="cover-start" href="{% url 'core:build' %}"><span>开始搭建</span><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12H28M19 3L28 12L19 21"/></svg></a>
      <button class="cover-records" id="open-records"><span>查看我的记录</span><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12H28M19 3L28 12L19 21"/></svg></button>
    </div>
  </div>
</main>
<dialog id="records-dialog"><div class="dialog-top"><h2>我的小世界</h2><button id="close-records" class="icon-button" aria-label="关闭记录">✕</button></div><p class="muted">作品保存在当前浏览器中。</p><div id="record-list"></div></dialog>
<script src="{% static 'core/home.js' %}?v=2"></script>
<script src="{% static 'core/cover-eyes.js' %}?v=5"></script>
<link rel="stylesheet" href="{% static 'core/onboarding.css' %}?v=1"><script defer src="{% static 'core/onboarding.js' %}?v=1"></script>
</body></html>
