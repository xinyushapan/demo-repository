{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的创作纪念 · 心语沙盘</title><link rel="stylesheet" href="{% static 'core/feedback.css' %}?v=4"><script src="{% static 'core/toy-catalog.js' %}"></script><script type="module" src="{% static 'core/feedback.js' %}?v=4"></script></head><body>
<header><a href="/" aria-label="心语沙盘首页"><img src="{% static 'core/images/wordmark.svg' %}" alt="心语沙盘"></a><a id="continue-build" href="/build/">← 继续搭建</a></header>
<main><section id="feedback-missing" hidden><h1>还没有找到这份作品</h1><p>作品保存在创建它的浏览器中。</p><a href="/build/">去搭建一个小世界 →</a></section>
<div id="feedback-shell" hidden><div id="certificate-stage" aria-busy="true"><canvas id="award-certificate" role="img" aria-label="正在准备创作奖状"></canvas><button id="share-feedback" class="certificate-hit certificate-share" disabled aria-label="保存分享奖状"></button><a id="full-report" class="certificate-hit certificate-report" href="/report/" aria-label="查看完整报告"></a></div><div class="certificate-status"><p id="feedback-status" role="status" aria-live="polite">小语正在准备你的创作纪念…</p><button id="retry-feedback" hidden>重新尝试</button></div></div></main>
<dialog id="feedback-consent"><h2>让小语回看这次搭建？</h2><p>生成反馈需要将本次沙具、位置、操作记录和你与小语的对话发送给 DeepSeek。不会发送摄像头图片或录音。</p><p>也可以只保留本机记录，不发送给 AI。</p><div><button id="feedback-local">只用本机记录</button><button id="feedback-agree">同意并生成</button></div></dialog></body></html>
